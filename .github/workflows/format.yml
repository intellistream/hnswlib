name: Format Code with clang-format

on:
  push:
    branches: [ main, instc ]
  pull_request:
    branches: [ main, instc ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format (C/C++)
        run: |
          set -e
          # Only run if there are matching files
          if git ls-files '*.cpp' '*.hpp' '*.cc' '*.cxx' '*.h' '*.hh' --error-unmatch >/dev/null 2>&1; then
            git ls-files '*.cpp' '*.hpp' '*.cc' '*.cxx' '*.h' '*.hh' -z | xargs -0 clang-format -i
          else
            echo "No C/C++ files to format."
          fi

      - name: Check for modified files
        id: git-check
        shell: bash
        run: |
          if ! git diff --quiet; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatted files
        if: steps.git-check.outputs.modified == 'true' && github.event_name == 'push'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Auto-format C/C++ code with clang-format"
          git push

      - name: Fail PR if formatting required
        if: steps.git-check.outputs.modified == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::Code formatting changes detected. Please run clang-format locally and push the results."
          exit 1
