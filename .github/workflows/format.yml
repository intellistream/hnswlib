name: Format Code with clang-format

on:
  push:
    branches: [ main, instr ]
  pull_request:
    branches: [ main, instr ]

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format (C/C++)
        run: |
          set -e
          if git ls-files '*.cpp' '*.hpp' '*.cc' '*.cxx' '*.h' '*.hh' --error-unmatch >/dev/null 2>&1; then
            git ls-files '*.cpp' '*.hpp' '*.cc' '*.cxx' '*.h' '*.hh' -z | xargs -0 clang-format -i
          else
            echo "No C/C++ files to format."
          fi

      - name: Commit formatted files (always on push)
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "Checking diff and committing if needed..."
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          if ! git diff --quiet; then
            echo "Changes detected. Committing..."
            git add -A
            git commit -m "Auto-format C/C++ code with clang-format"
